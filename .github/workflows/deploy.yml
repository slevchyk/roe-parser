name: Hourly Pages Deploy

on:
  schedule:
    - cron: '35 * * * *' # Запуск щогодини (35 хв)
  workflow_dispatch: # Кнопка для ручного деплою

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "custom-hourly-deploy"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
